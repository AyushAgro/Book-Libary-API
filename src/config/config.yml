ApiEndpoints:
  # Category Create
  create_category:
    active: True
  # FUTURE: everything smallcase through out projects
    METHOD: POST
    admin_only: True
    login_required: True
    params:
      mandatory:
        function: handle_params
        values:
          category:
            param_name: category
            param_dtype: str
            param_validation_function: check_string
  # Category Read
  fetch_category:
    active: True
    METHOD: GET
    admin_only: True
    login_required: True
  # Category Update
  update_category:
    active: True
    METHOD: PATCH
    admin_only: True
    login_required: True
    params:
      mandatory:
        function: handle_params
        values:
          old_category:
            param_name: old_category
            param_dtype: str
            param_validation_function: check_string
          new_category:
            param_name: new_category
            param_dtype: str
            param_validation_function: check_string
  # Category Delete
  delete_category:
    active: True
    METHOD: DELETE
    admin_only: True
    login_required: True
    params:
      mandatory:
        function: handle_params
        values:
          category_idx:
            param_name: category_idx
            param_dtype: int
            param_validation_function: check_int
  # Book Create
  add_book:
    active: True
    METHOD: POST
    admin_only: True
    login_required: True
    params:
      mandatory:
        function: handle_params
        values:
          title:
            param_name: title
            param_dtype: str
            param_validation_function: check_string
          author:
            param_name: author
            param_dtype: str
            param_validation_function: check_string
          category_idx:
            param_name: category_idx
            param_dtype: int
            param_validation_function: check_int
          published_year:
            param_name: published_year
            param_dtype: int
            param_validation_function: check_year
          price:
            param_name: price
            param_dtype: float
            param_validation_function: check_decimal
          stock_unit:
            param_name: stock_unit
            param_dtype: int
            param_validation_function: check_int
          tags:
            param_name: tags
            param_dtype: dict
            param_validation_function: check_tags
  # Books Read
  fetch_books:
    active: True
    METHOD: GET
    admin_only: False
    login_required: False
    params:
      optional:
        function: handle_optional_params
        values:
          category:
            param_name: category
            param_dtype: str
            param_validation_function: check_string
          author:
            param_name: author
            param_dtype: str
            param_validation_function: check_string
          title:
            param_name: title
            param_dtype: str
            param_validation_function: check_string
          filter_operation:
            param_name: filter_operation
            param_dtype: str
            param_validation_function: check_filter_operation
          published_year:
            param_name: published_year
            param_dtype: int
            param_validation_function: check_year
  update_book_details:
    active: True
    METHOD: PATCH
    admin_only: True
    login_required: True
    params:
      mandatory:
        function: handle_params
        values:
          book_id:
            param_name: book_id
            param_dtype: int
            param_validation_function: check_int
      optional:
        function: handle_optional_params
        values:
          title:
            param_name: title
            param_dtype: str
            param_validation_function: check_string
          author:
            param_name: author
            param_dtype: str
            param_validation_function: check_string
          category_idx:
            param_name: category_idx
            param_dtype: int
            param_validation_function: check_int
          published_year:
            param_name: published_year
            param_dtype: int
            param_validation_function: check_year
          price:
            param_name: price
            param_dtype: float
            param_validation_function: check_decimal
  # Book Delete
  delete_book:
    active: True
    METHOD: DELETE
    admin_only: True
    login_required: True
    params:
      mandatory:
        function: handle_params
        values:
          book_id:
            param_name: book_id
            param_dtype: int
            param_validation_function: check_int
  # Add New book to the user cart based on book id
  add_to_cart:
    active: True
    METHOD: POST
    admin_only: False
    login_required: True
    params:
      mandatory:
        function: handle_params
        values:
          book_id:
            param_name: book_id
            param_dtype: int
            param_validation_function: check_param
  # List Book in user cart
  list_books_in_cart:
    active: True
    METHOD: GET
    admin_only: False
    login_required: True
  empty_cart:
    active: True
    METHOD: DELETE
    admin_only: False
    login_required: True
  # Checkout Order
  checkout_order:
    active: True
    METHOD: POST
    admin_only: False
    login_required: True
  # Fetch User Past Orders
  fetch_user_past_orders:
    active: True
    METHOD: GET
    admin_only: False
    login_required: True
  # Fetch all past order in library
  fetch_all_past_orders:
    active: True
    METHOD: GET
    admin_only: True
    login_required: True
  # User Login
  login:
    active: True
    METHOD: GET
    admin_only: False
    login_required: False
    no_user_logged_in: True
    params:
      mandatory:
        function: handle_params
        values:
          email:
            param_name: email
            param_dtype: str
            param_validation_function: check_email
          password:
            param_name: password
            param_dtype: str
            param_validation_function: check_login_password
  # User Register
  register:
    active: True
    METHOD: POST
    admin_only: False
    login_required: False
    no_user_logged_in: True
    params:
      mandatory:
        function: handle_params
        values:
          email:
            param_name: email
            param_dtype: str
            param_validation_function: check_email
          password:
            param_name: password
            param_dtype: str
            param_validation_function: check_register_password
      optional:
        function: handle_optional_params
        values:
          name:
            param_name: name
            param_dtype: str
            param_validation_function: check_string
          tags:
            param_name: tags
            param_dtype: dict
            param_validation_function: check_tags
  # User Logout
  logout:
    active: True
    METHOD: POST
    admin_only: False
    login_required: True

