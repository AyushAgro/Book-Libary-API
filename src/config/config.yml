Gateway_api:
  port: 8089
  debug: False
  url_prefix: '/library_api'

Notifier:
  active: False

Logging:
  version: 1
  disable_existing_loggers: False
  formatters:
    simple:
      format: '%(asctime)s - %(name)s - %(filename)s - %(lineno)s - %(levelname)s - %(message)s'
  handlers:
    console:
      class: logging.StreamHandler
      level: DEBUG
      formatter: simple
      stream: ext://sys.stdout
    file:
      class: logging.FileHandler
      level: DEBUG
      filename: log/prod.log
      formatter: simple
  root:
    level: DEBUG
    handlers: [ file ]

